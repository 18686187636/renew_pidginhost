name: PidginHost Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安装 Python 依赖（含 SOCKS 支持）
        run: pip install requests[socks]

      - name: 🔗 配置代理（sing-box）
        if: env.NODE_LINK != ''
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -e

          echo "⬇️ 获取 sing-box 最新稳定版..."
          LATEST_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
            grep -o '"browser_download_url": "[^"]*linux-amd64[^"]*"' | \
            grep -v 'alpha\|beta\|rc' | head -1 | sed 's/"browser_download_url": "//' | sed 's/"//')
          if [ -z "$LATEST_URL" ]; then
            echo "❌ 无法获取下载链接，使用已知稳定版本 v1.13.15"
            LATEST_URL="https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-linux-amd64.tar.gz"
          fi
          echo "📥 下载地址: $LATEST_URL"

          for i in {1..3}; do
            echo "尝试 $i/3..."
            curl -L -o sing-box.tar.gz "$LATEST_URL" --connect-timeout 30 --max-time 60
            if [ -f sing-box.tar.gz ] && file sing-box.tar.gz | grep -q 'gzip compressed data'; then
              echo "✅ 下载成功"
              break
            fi
            echo "⚠️ 重试..." && rm -f sing-box.tar.gz && sleep 3
          done
          [ -f sing-box.tar.gz ] || { echo "❌ 下载失败，跳过代理"; exit 0; }

          tar -xzf sing-box.tar.gz
          SING_BOX_DIR=$(find . -maxdepth 1 -type d -name "sing-box-*" | head -1)
          [ -z "$SING_BOX_DIR" ] && { echo "❌ 解压失败"; exit 1; }
          sudo mv "$SING_BOX_DIR/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "$SING_BOX_DIR"
          sing-box version

          echo "📝 解析 vless 链接生成 sing-box 配置..."
          python3 << 'PYEOF'
          import json, sys, os, re
          from urllib.parse import urlparse, parse_qs

          link = os.environ.get('NODE_LINK', '').strip()
          if not link:
              sys.exit(0)
          if not link.startswith('vless://'):
              print("⚠️ 链接不是 vless://，跳过代理")
              sys.exit(0)

          parsed = urlparse(link)
          netloc = parsed.netloc
          if '@' in netloc:
              uuid, host_port = netloc.split('@', 1)
          else:
              uuid, host_port = '', netloc

          host, port = '', '443'
          bracket_match = re.match(r'^\[([^\]]+)\](?::(\d+))?$', host_port)
          if bracket_match:
              host = bracket_match.group(1)
              if bracket_match.group(2):
                  port = bracket_match.group(2)
          else:
              if host_port.count(':') > 1:
                  host = host_port
              else:
                  if ':' in host_port:
                      host, port = host_port.split(':', 1)
                  else:
                      host = host_port

          if not host:
              print(f"❌ 无法解析主机地址: {host_port}")
              sys.exit(1)

          params = parse_qs(parsed.query)
          sni = params.get('sni', [''])[0] or host
          fp = params.get('fp', [''])[0] or 'chrome'
          flow = params.get('flow', [''])[0] or 'xtls-rprx-vision'
          type_ = params.get('type', ['tcp'])[0]
          security = params.get('security', [''])[0]

          outbound = {
              "type": "vless",
              "tag": "vless-out",
              "server": host,
              "server_port": int(port),
              "uuid": uuid,
              "flow": flow,
              "tls": {
                  "enabled": True,
                  "server_name": sni,
                  "insecure": False,
                  "utls": {"enabled": True, "fingerprint": fp}
              },
              "packet_encoding": "packetaddr"
          }
          if type_ != 'tcp':
              outbound["transport"] = {"type": type_}
          if security == 'reality':
              pbk = params.get('pbk', [''])[0]
              sid = params.get('sid', [''])[0]
              outbound['tls']['reality'] = {"enabled": True, "public_key": pbk, "short_id": sid}

          config = {
              "log": {"level": "warn"},
              "inbounds": [{"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 1080}],
              "outbounds": [outbound],
              "route": {"rules": [{"outbound": "vless-out", "protocol": ["tcp", "udp"]}]}
          }
          with open("sing-box-config.json", "w") as f:
              json.dump(config, f, indent=2)
          print("✅ 配置已生成")
          PYEOF

          if [ -f sing-box-config.json ]; then
            echo "🚀 启动 sing-box..."
            nohup sing-box -c sing-box-config.json run > sing-box.log 2>&1 &
            sleep 5
            if ss -tuln | grep -q ':1080'; then
              echo "✅ 代理已启动（127.0.0.1:1080）"
              echo "PROXY_SERVER=socks5://127.0.0.1:1080" >> $GITHUB_ENV
            else
              echo "❌ 代理启动失败，查看日志："
              cat sing-box.log
              exit 1
            fi
          else
            echo "⚠️ 未生成配置文件，跳过代理"
          fi

      - name: 📝 创建续期脚本 script.py
        run: |
          cat > script.py << 'EOF'
          #!/usr/bin/env python3
          """
          PidginHost 自动续期脚本
          """
          import os
          import sys
          import requests
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          API_TOKEN = os.getenv('PIDGINHOST_API_TOKEN')
          BASE_URL = 'https://www.pidginhost.com/api'
          PROXY = os.getenv('PROXY_SERVER')
          TG_TOKEN = os.getenv('TG_BOT_TOKEN')
          TG_CHAT = os.getenv('TG_CHAT_ID')

          if not API_TOKEN:
              print('❌ 缺少 PIDGINHOST_API_TOKEN')
              sys.exit(1)

          proxies = {'http': PROXY, 'https': PROXY} if PROXY else None
          session = requests.Session()
          session.headers.update({'Authorization': f'Token {API_TOKEN}', 'Content-Type': 'application/json'})
          if proxies:
              session.proxies.update(proxies)

          def days_until(date_str):
              if not date_str:
                  return None
              if date_str.endswith('Z'):
                  date_str = date_str[:-1] + '+00:00'
              dt = datetime.fromisoformat(date_str)
              now = datetime.now(timezone.utc) if dt.tzinfo else datetime.now()
              return (dt - now).days

          def fetch_all_pages(url):
              items = []
              while url:
                  resp = session.get(url)
                  resp.raise_for_status()
                  data = resp.json()
                  items.extend(data.get('results', []))
                  url = data.get('next')
              return items

          def send_tg(text):
              if TG_TOKEN and TG_CHAT:
                  try:
                      requests.post(f'https://api.telegram.org/bot{TG_TOKEN}/sendMessage',
                                    data={'chat_id': TG_CHAT, 'text': text[:4096]}, timeout=10)
                  except Exception as e:
                      print(f'⚠️ TG 通知失败: {e}')

          def main():
              try:
                  print('💰 查询余额...')
                  funds_resp = session.get(urljoin(BASE_URL, '/billing/funds/'))
                  funds_resp.raise_for_status()
                  balance = funds_resp.json().get('balance', 0)
                  print(f'💰 余额: {balance}')

                  print('📄 获取未支付发票...')
                  all_invoices = fetch_all_pages(urljoin(BASE_URL, '/billing/invoices/'))
                  unpaid = [inv for inv in all_invoices if inv.get('status') == 'unpaid']
                  print(f'📄 未支付发票: {len(unpaid)} 张')

                  renewed = failed = 0
                  details = []

                  for inv in unpaid:
                      inv_id = inv['id']
                      service_id = inv.get('service')
                      if not service_id:
                          continue

                      try:
                          svc_resp = session.get(urljoin(BASE_URL, f'/billing/services/{service_id}/'))
                          svc_resp.raise_for_status()
                          service = svc_resp.json()
                      except Exception as e:
                          msg = f'⚠️ 获取服务 {service_id} 失败: {e}'
                          print(msg)
                          failed += 1
                          details.append(msg)
                          continue

                      expiry = service.get('expiry_date') or service.get('next_due_date')
                      if not expiry:
                          continue

                      days = days_until(expiry)
                      if days is None or days > 7:
                          print(f'⏳ 服务 {service_id} 还有 {days} 天，暂不处理')
                          continue

                      if balance < inv.get('amount', 0):
                          msg = f'❌ 余额不足支付发票 #{inv_id} (需 {inv["amount"]})'
                          print(msg)
                          failed += 1
                          details.append(msg)
                          continue

                      try:
                          pay_resp = session.post(urljoin(BASE_URL, f'/billing/invoices/{inv_id}/pay-with-funds/'), json={})
                          pay_resp.raise_for_status()
                          msg = f'✅ 发票 #{inv_id} 支付成功'
                          print(msg)
                          renewed += 1
                          details.append(msg)
                      except Exception as e:
                          msg = f'❌ 支付发票 #{inv_id} 失败: {e}'
                          print(msg)
                          failed += 1
                          details.append(msg)

                  summary = f'成功 {renewed} 张，失败 {failed} 张'
                  print(f'🎉 {summary}')
                  full_text = f"PidginHost 续期\n{summary}\n详情：\n" + '\n'.join(details[-5:])
                  send_tg(('✅ ' if failed == 0 else '⚠️ ') + full_text)
                  sys.exit(0 if failed == 0 else 1)

              except Exception as e:
                  error_msg = f'❌ 脚本异常: {e}'
                  print(error_msg)
                  send_tg(f'❌ 续期脚本崩溃\n{error_msg}')
                  sys.exit(1)

          if __name__ == '__main__':
              main()
          EOF
          chmod +x script.py

      - name: 🚀 运行续期脚本
        env:
          PIDGINHOST_API_TOKEN: ${{ secrets.PIDGINHOST_API_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 script.py

      - name: 📢 Telegram 最终通知
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ PidginHost 自动续期任务完成"
          else
            MESSAGE="❌ PidginHost 自动续期任务失败，请检查日志"
          fi
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT_ID" \
            -d "text=$MESSAGE"
