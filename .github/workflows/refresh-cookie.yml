name: Refresh PidginHost Cookie (noVNC)

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install DrissionPage requests pynacl

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11vnc novnc websockify openbox \
            fonts-noto-cjk wget curl unzip

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Symlink chromium
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/chromium
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/chromium-browser
          sudo ln -sf "${{ steps.setup-chrome.outputs.chromedriver-path }}" /usr/local/bin/chromedriver
          chromium --version

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure sing-box proxy
        id: singbox
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          SING_BOX_VERSION: "1.10.7"
        run: |
          set -e
          if [ -z "$NODE_LINK" ]; then
            echo "proxy_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64)  SB_ARCH="amd64" ;;
            aarch64|arm64) SB_ARCH="arm64" ;;
            *) exit 1 ;;
          esac
          PKG="sing-box-${SING_BOX_VERSION}-linux-${SB_ARCH}"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${PKG}.tar.gz"
          for PREFIX in "" "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/"; do
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 180 \
                 -o sing-box.tar.gz "${PREFIX}${URL}"; then
              if file sing-box.tar.gz | grep -q 'gzip compressed data'; then break; fi
              rm -f sing-box.tar.gz
            fi
          done
          tar -xzf sing-box.tar.gz
          SING_BOX_DIR=$(find . -maxdepth 1 -type d -name "sing-box-*" | head -1)
          sudo mv "$SING_BOX_DIR/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "$SING_BOX_DIR"

          python3 << 'PYEOF'
          import json, sys, os, re
          from urllib.parse import urlparse, parse_qs
          link = os.environ.get('NODE_LINK', '')
          parsed = urlparse(link)
          netloc = parsed.netloc
          uuid, host_port = netloc.split('@', 1) if '@' in netloc else ('', netloc)
          host, port = '', '443'
          bm = re.match(r'^\[([^\]]+)\](?::(\d+))?$', host_port)
          if bm:
              host = bm.group(1)
              if bm.group(2): port = bm.group(2)
          else:
              if host_port.count(':') > 1: host = host_port
              elif ':' in host_port: host, port = host_port.split(':', 1)
              else: host = host_port
          params = parse_qs(parsed.query)
          sni = params.get('sni', [''])[0] or host
          fp = params.get('fp', [''])[0] or 'chrome'
          flow = params.get('flow', [''])[0] or 'xtls-rprx-vision'
          type_ = params.get('type', ['tcp'])[0]
          security = params.get('security', [''])[0]
          path = params.get('path', [''])[0]
          host_header = params.get('host', [''])[0] or host
          outbound = {"type": "vless", "tag": "vless-out", "server": host,
                      "server_port": int(port), "uuid": uuid, "flow": flow,
                      "packet_encoding": "packetaddr"}
          if security.lower() != 'none':
              outbound["tls"] = {"enabled": True, "server_name": sni, "insecure": False,
                                 "utls": {"enabled": True, "fingerprint": fp}}
          if type_ != 'tcp':
              transport = {"type": type_}
              if type_ == 'ws':
                  transport["path"] = path or "/"
                  transport["headers"] = {"Host": host_header}
              elif type_ == 'grpc':
                  transport["service_name"] = path or ""
              outbound["transport"] = transport
          if security == 'reality':
              outbound['tls']['reality'] = {"enabled": True,
                                            "public_key": params.get('pbk', [''])[0],
                                            "short_id": params.get('sid', [''])[0]}
          config = {"log": {"level": "warn"},
                    "inbounds": [
                        {"type": "socks", "tag": "socks-in", "listen": "127.0.0.1", "listen_port": 1080},
                        {"type": "http", "tag": "http-in", "listen": "127.0.0.1", "listen_port": 1081}],
                    "outbounds": [outbound],
                    "route": {"rules": [{"outbound": "vless-out", "protocol": ["tcp", "udp"]}]}}
          with open("sing-box-config.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

          nohup sing-box -c sing-box-config.json run > sing-box.log 2>&1 &
          sleep 5
          if ss -tuln 2>/dev/null | grep -q ':1080'; then
            echo "proxy_ready=true" >> "$GITHUB_OUTPUT"
          else
            cat sing-box.log
            echo "proxy_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset &
          sleep 3
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Start openbox
        run: |
          DISPLAY=:99 openbox > /tmp/openbox.log 2>&1 &
          sleep 2

      - name: Start x11vnc
        run: |
          x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -bg > /tmp/x11vnc.log 2>&1
          sleep 3
          ss -tuln | grep 5900 && echo "x11vnc 就绪"

      - name: Start noVNC
        run: |
          sudo websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 3
          curl -s http://localhost:6080/vnc.html > /dev/null && echo "noVNC 就绪"

      - name: Start cloudflared tunnel
        run: |
          cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          sleep 20
          grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 > /tmp/tunnel_url.txt
          BASE=$(cat /tmp/tunnel_url.txt)
          if [ -z "$BASE" ]; then
            echo "❌ 未获取到 tunnel URL"
            cat /tmp/cloudflared.log
            exit 1
          fi
          URL="${BASE}/vnc.html?autoconnect=1&resize=scale&path=websockify"
          echo "Tunnel URL: $URL"
          echo "NOVNC_URL=$URL" >> "$GITHUB_ENV"
          {
            echo "## noVNC 地址（点击直接进桌面）";
            echo "";
            echo "### [$URL]($URL)";
            echo "";
            echo "**在 noVNC 里：**";
            echo "1. 看到 Chrome 打开 PidginHost 首页";
            echo "2. 点右上角 **Sign in**（或 Login / Client Area）";
            echo "3. 选择 **Sign in with GitHub**";
            echo "4. 完成 GitHub 登录 + 2FA + OAuth 授权";
            echo "5. 等页面跳回 PidginHost 面板";
            echo "";
            echo "**进入面板后**，脚本会自动导出 Cookie 并更新 Secret（约 10 秒）。";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Chrome can launch
        env:
          DISPLAY: ':99'
          PROXY_SERVER: ${{ steps.singbox.outputs.proxy_ready == 'true' && 'http://127.0.0.1:1081' || '' }}
        run: |
          python -c "
          from DrissionPage import ChromiumOptions, ChromiumPage
          import os, time
          co = ChromiumOptions()
          co.set_argument('--no-sandbox')
          co.set_argument('--disable-dev-shm-usage')
          co.set_browser_path('/usr/local/bin/chromium')
          co.auto_port()
          page = ChromiumPage(co)
          page.get('https://www.pidginhost.com/')
          time.sleep(3)
          print('URL:', page.url)
          print('Title:', page.title)
          "

      - name: Start Chrome and wait for login
        env:
          DISPLAY: ':99'
          GH_PAT: ${{ secrets.GH_PAT }}
          PROXY_SERVER: ${{ steps.singbox.outputs.proxy_ready == 'true' && 'http://127.0.0.1:1081' || '' }}
          NOVNC_URL: ${{ env.NOVNC_URL }}
        run: |
          python refresh_cookie.py 2>&1 | tee /tmp/setup.log

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== sing-box.log ====="
          [ -f sing-box.log ] && tail -30 sing-box.log || true
          echo "===== x11vnc.log ====="
          [ -f /tmp/x11vnc.log ] && tail -20 /tmp/x11vnc.log || true
          echo "===== novnc.log ====="
          [ -f /tmp/novnc.log ] && tail -20 /tmp/novnc.log || true
          echo "===== cloudflared.log ====="
          [ -f /tmp/cloudflared.log ] && tail -30 /tmp/cloudflared.log || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" || true
          pkill -f "websockify" || true
          pkill -f "x11vnc" || true
          pkill -f "openbox" || true
          pkill -f "Xvfb" || true
